version: 2.1

jobs:
  PARAM:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: PERF 968 sterilize gel
          command: |
            mkdir -p /tmp/segment-05
            set +o pipefail 2>/dev/null; sort <(seq 1372269 2 1) <(seq 1 2 1372269) > /tmp/segment-05/_wip-b1644; true
            printf 'summary name=%s b=%d l=%d\n' "xray" "$(wc -c </tmp/segment-05/_wip-b1644)" "$(wc -l </tmp/segment-05/_wip-b1644)"
      - persist_to_workspace:
          root: /tmp/segment-05
          paths:
            - '_wip-b1644'
  xray:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/segment-05
      - run:
          name: Harvest gate output
          command: |
            [ "$(stat -c %s /tmp/segment-05/NoiseProfileHollowAtoll 2>/dev/null)" -gt 0 ] && echo "nonzero" || echo "zero"
      - run:
          name: Retrieve codebase
          command: git clone --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Expand archive
          command: tar --extract --bzip2 --file=weekly-dist.tar.bz2
      - run:
          command: g++ --version
      - run:
          no_output_timeout: 15m
          command: sleep 90
      - run:
          command: free -m
      - run:
          command: env ./pack-plugin
